name: 部署 OpenWrt 软件源页面

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  deploy-pages:
    name: 重新生成 GitHub Pages 网站
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 恢复现有 GitHub Pages 内容
        run: |
          set -euo pipefail

          mkdir -p gh-pages-content
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git --work-tree=gh-pages-content checkout FETCH_HEAD -- .
          fi

      - name: 更新下载徽章数据
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/generate-downloads-badge.sh \
            "$GITHUB_WORKSPACE/gh-pages-content/downloads.json" \
            "$GITHUB_REPOSITORY"

      - name: 检查现有软件源内容
        run: |
          set -euo pipefail

          if [ -z "$(find gh-pages-content -name packages.adb -type f -print -quit)" ]; then
            echo "未找到现有的 gh-pages 软件源内容。"
            exit 1
          fi

      - name: 生成 GitHub Pages 网站
        run: |
          set -euo pipefail

          bash .github/scripts/generate-feed-pages.sh \
            "$GITHUB_WORKSPACE/gh-pages-content" \
            "https://slava-shchipunov.github.io/awg-openwrt"

      - name: 发布到 GitHub Pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gh-pages-content
          enable_jekyll: true
