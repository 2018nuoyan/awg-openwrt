name: 根据标签创建发行版

on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt 版本（例如 24.10.5）'
        required: true
        type: string
      targets:
        description: '目标平台（使用逗号分隔，可选）'
        required: false
        type: string
      subtargets:
        description: '子目标平台（使用逗号分隔，可选）'
        required: false
        type: string


jobs:
  generate-config:
    runs-on: ubuntu-latest
    outputs:
      job-config: ${{ steps.generate-config.outputs.job-config }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.16.0'

      - name: 从输入或标签获取 OpenWrt 版本
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV

            if [ -n "${{ inputs.targets }}" ]; then
              echo "TARGETS=${{ inputs.targets }}" >> $GITHUB_ENV
            fi

            if [ -n "${{ inputs.subtargets }}" ]; then
              echo "SUBTARGETS=${{ inputs.subtargets }}" >> $GITHUB_ENV
            fi

          elif [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo "VERSION=${{ inputs.tag_name }}" >> $GITHUB_ENV

          else
            echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV
          fi

      - name: 安装依赖
        run: npm install

      - name: 生成任务配置
        id: generate-config
        run: node index.js ${{ env.VERSION }} "${{ env.TARGETS }}" "${{ env.SUBTARGETS }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: "v${{ matrix.build_env.tag }} - ${{ matrix.build_env.pkgarch}} :: 构建 ${{ matrix.build_env.target}}/${{ matrix.build_env.subtarget}}"
    runs-on: ubuntu-latest
    needs: generate-config
    strategy:
      matrix:
        build_env: ${{ fromJson(needs.generate-config.outputs.job-config) }}
      fail-fast: false

    steps:
      - name: 检出 AWG 源代码
        uses: actions/checkout@v4

      - name: 安装 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyelftools

      - name: 缓存 OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        env:
          cache-name: "cache-sdk-${{ matrix.build_env.tag }}-${{ matrix.build_env.target}}-${{ matrix.build_env.subtarget}}"
        with:
          path: openwrt-sdk-*/
          key: ${{ runner.os }}-sdk-${{ env.cache-name }}

      - name: 下载并解压 OpenWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          echo "软件包架构：${{ matrix.build_env.pkgarch }}，目标平台：${{ matrix.build_env.target }}，子目标平台：${{ matrix.build_env.subtarget }}"

          # Get the actual SDK filename from the directory listing
          SDK_FILE=$(curl -s "https://downloads.immortalwrt.org/releases//${{ matrix.build_env.tag }}/targets/${{ matrix.build_env.target}}/${{ matrix.build_env.subtarget}}/" | grep -o "openwrt-sdk-${{ matrix.build_env.tag }}-${{ matrix.build_env.target}}-${{ matrix.build_env.subtarget}}_gcc-[^\"]*_musl[^\"]*\.Linux-x86_64\.tar\.[xz|zst]*" | head -n1)
          
          if [ -z "$SDK_FILE" ]; then
            echo "未找到适用于 ${{ matrix.build_env.tag }} ${{ matrix.build_env.target}} ${{ matrix.build_env.subtarget}} 的 SDK 文件"
            exit 1
          fi
          
          SDK_DOWNLOAD_URL="https://downloads.immortalwrt.org/releases//${{ matrix.build_env.tag }}/targets/${{ matrix.build_env.target}}/${{ matrix.build_env.subtarget}}/${SDK_FILE}"
          echo "正在下载 SDK：$SDK_DOWNLOAD_URL"
          
          wget "$SDK_DOWNLOAD_URL"
          
          # Extract based on file extension
          if [[ "$SDK_FILE" == *.tar.zst ]]; then
            tar --zstd -xf "$SDK_FILE"
          elif [[ "$SDK_FILE" == *.tar.xz ]]; then
            tar -xf "$SDK_FILE"
          else
            echo "未知的压缩包格式：$SDK_FILE"
            exit 1
          fi
          
          rm "$SDK_FILE"

      - name: 配置 SDK 和软件源
        run: |
          # Find SDK directory
          SDK_DIR=$(find . -maxdepth 1 -name "openwrt-sdk-*" -type d | head -n1)
          
          if [ -z "$SDK_DIR" ]; then
            echo "未找到 SDK 目录"
            exit 1
          fi
          
          # Get absolute paths
          WORKSPACE_DIR=$(pwd)
          
          cd "$SDK_DIR"
          
          # Update feeds to include LuCI
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # Copy current repository packages directly to package directory
          cp -r "$WORKSPACE_DIR/kmod-amneziawg" package/
          cp -r "$WORKSPACE_DIR/amneziawg-tools" package/
          cp -r "$WORKSPACE_DIR/luci-proto-amneziawg" package/
          
          # Configure packages to build
          echo "CONFIG_PACKAGE_kmod-amneziawg=m" > .config
          echo "CONFIG_PACKAGE_amneziawg-tools=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-amneziawg=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-amneziawg-ru=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-amneziawg-zh-cn=y" >> .config
          
          make defconfig

      - name: 构建 AmneziaWG 软件包
        run: |
          # Find SDK directory
          SDK_DIR=$(find . -maxdepth 1 -name "openwrt-sdk-*" -type d | head -n1)
          cd "$SDK_DIR"

          echo "正在构建 AmneziaWG 软件包…"

          # Building the top-level LuCI package also builds its dependencies:
          # luci-proto-amneziawg -> amneziawg-tools -> kmod-amneziawg.
          # Keep this in a single make invocation to avoid rebuilding the
          # kernel package for every individual target, especially on 25.x.
          make package/luci-proto-amneziawg/compile V=s
          
          echo "构建完成，正在检查生成的软件包…"
          find bin/ -name "*.?pk" | grep -E "(amneziawg|luci-proto-amneziawg|luci-i18n-amneziawg)" | head -10

      - name: 准备构建产物
        run: |
          # Find SDK directory
          SDK_DIR=$(find . -maxdepth 1 -name "openwrt-sdk-*" -type d | head -n1)
          
          mkdir -p awgrelease
          postfix="v${{ matrix.build_env.tag }}_${{ matrix.build_env.pkgarch}}_${{ matrix.build_env.target}}_${{ matrix.build_env.subtarget}}"
          
          # Copy built packages
          find "$SDK_DIR/bin/packages" -name "amneziawg-tools*.?pk" -exec sh -c 'file="$1"; postfix="$2"; ext="${file##*.}"; cp "$file" "awgrelease/amneziawg-tools_${postfix}.${ext}"' _ {} "${postfix}" \; || echo "未找到 amneziawg-tools 软件包"
          find "$SDK_DIR/bin/packages" -name "luci-proto-amneziawg*.?pk" -exec sh -c 'file="$1"; postfix="$2"; ext="${file##*.}"; cp "$file" "awgrelease/luci-proto-amneziawg_${postfix}.${ext}"' _ {} "${postfix}" \; || echo "未找到 luci-proto-amneziawg 软件包"
          find "$SDK_DIR/bin/packages" -name "luci-i18n-amneziawg-ru*.?pk" -exec sh -c 'file="$1"; postfix="$2"; ext="${file##*.}"; cp "$file" "awgrelease/luci-i18n-amneziawg-ru_${postfix}.${ext}"' _ {} "${postfix}" \; || echo "未找到 luci-i18n-amneziawg-ru 软件包"
          find "$SDK_DIR/bin/packages" -name "luci-i18n-amneziawg-zh-cn*.?pk" -exec sh -c 'file="$1"; postfix="$2"; ext="${file##*.}"; cp "$file" "awgrelease/luci-i18n-amneziawg-zh-cn_${postfix}.${ext}"' _ {} "${postfix}" \; || echo "未找到 luci-i18n-amneziawg-zh-cn 软件包"
          find "$SDK_DIR/bin/targets" -name "kmod-amneziawg*.?pk" -exec sh -c 'file="$1"; postfix="$2"; ext="${file##*.}"; cp "$file" "awgrelease/kmod-amneziawg_${postfix}.${ext}"' _ {} "${postfix}" \; || echo "未找到 kmod-amneziawg 软件包"
          
          echo "已构建的软件包："
          ls -la awgrelease/

      - name: 发布发行版
        uses: softprops/action-gh-release@v1
        with:
          files: awgrelease/*.?pk
          tag_name: v${{ matrix.build_env.tag }}
